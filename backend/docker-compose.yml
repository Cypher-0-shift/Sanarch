version: "3.9"

services:
  clamav:
    image: clamav/clamav:stable

    ports:
      - "3310:3310"

    volumes:
      - clamav_data:/var/lib/clamav

    environment:
      - CLAMAV_NO_MILTERD=true

    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s


  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      clamav:
        condition: service_healthy

    environment:
      - CLAMD_HOST=clamav

    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s


  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker

    command: >
      celery
      -A app.workers.celery_app
      worker
      --loglevel=info
      --queues=documents
      --concurrency=2
      --max-tasks-per-child=50

    env_file:
      - .env

    depends_on:
      clamav:
        condition: service_healthy

    environment:
      - CLAMD_HOST=clamav

    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro


volumes:
  clamav_data: